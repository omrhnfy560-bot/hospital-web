<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Doctors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
    .navbar { background: #1a1a2e; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .navbar h1 { color: white; font-size: 20px; }
    .navbar a { color: #e0e0e0; text-decoration: none; font-size: 14px; margin-left: 16px; }
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h2 { color: #1a1a2e; }
    .card { background: white; padding: 20px 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card h3 { font-size: 16px; color: #1a1a2e; margin-bottom: 4px; }
    .card p { font-size: 13px; color: #888; }
    .delete { color: #999; text-decoration: none; font-size: 13px; }
    .add-card { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-top: 32px; }
    .add-card h3 { color: #1a1a2e; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    button { width: 100%; padding: 11px; background: #c0392b; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    button:hover { background: #a93226; }
    .back { display: inline-block; margin-bottom: 20px; color: #c0392b; text-decoration: none; font-size: 14px; }
    .empty { text-align: center; color: #aaa; margin-top: 40px; font-size: 15px; }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>🏥 Hospital Management System</h1>
    <div>
      <a href="/">Home</a>
      <a href="/logout">Logout</a>
    </div>
  </div>
  <div class="container">
    <a href="/" class="back">← Back</a>
    <div class="top-bar">
      <h2>Doctors ({{ doctors|length }})</h2>
    </div>

    {% if doctors %}
      {% for did, d in doctors.items() %}
      <div class="card">
        <div>
          <h3>Dr. {{ d.name }}</h3>
          <p>ID: {{ did }} · {{ d.specialty }}</p>
        </div>
        <a href="/remove_doctor/{{ did }}" class="delete" onclick="return confirm('Remove Dr. {{ d.name }}?')">Remove</a>
      </div>
      {% endfor %}
    {% else %}
      <div class="empty">No doctors yet.</div>
    {% endif %}

    <div class="add-card">
      <h3>Add New Doctor</h3>
      <form method="POST" action="/add_doctor">
        <input type="text" name="doctor_id" placeholder="Doctor ID (e.g. 101)" required>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="specialty" placeholder="Specialty (e.g. Cardiology)" required>
        <button type="submit">Add Doctor</button>
      </form>
    </div>
  </div>
</body>
</html>
